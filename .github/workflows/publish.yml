name: Publish to PyPI

# Triggered by pushing a version tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
    - "v*.*.*"

permissions:
  contents: read # checkout
  id-token: write # OIDC token for PyPI Trusted Publisher — no API keys needed

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: uv sync

    # Run quality gate before publishing
    - name: Ruff lint
      run: uv run ruff check .

    - name: Run tests
      run: uv run pytest -v

    # Build wheel + sdist
    - name: Build package
      run: uv build --no-sources

    - name: Upload built distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/PySheild/

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Download built distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    # Trusted Publisher — OIDC token generated automatically by GitHub.
    # Configured on pypi.org → Projects → pyshield → Publishing → GitHub Actions
    # Token claims automatically matched:
    #   owner:      biswa-mohapatro
    #   repo:       PySheild
    #   workflow:   publish.yml
    #   environment: pypi
    - name: Publish to PyPI
      run: uv publish

  publish-testpypi:
    # Optional dry-run against Test PyPI — remove this job once confident
    name: Publish to Test PyPI (dry-run)
    needs: build
    runs-on: ubuntu-latest
    if: false # set to: github.event_name == 'push' to enable
    environment:
      name: testpypi
      url: https://test.pypi.org/project/PySheild/

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Download built distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to Test PyPI
      run: uv publish --publish-url https://test.pypi.org/legacy/
